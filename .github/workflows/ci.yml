name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.27.1"
  PYTHON_VERSION: "3.12"
  JAVA_VERSION: "17"

jobs:
  # ───────────────────────────────────────────────────────────
  # Repo hygiene. Cheap, runs first, catches the mistakes that
  # have already happened once in this project's history.
  # ───────────────────────────────────────────────────────────
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the secret scan can see every commit

      - name: Block build artefacts, IDE files and secrets
        run: |
          set -euo pipefail
          fail=0

          check_absent() {
            local pattern="$1" why="$2"
            if git ls-files | grep -qE "$pattern"; then
              echo "::error::Committed $why — these must be git-ignored:"
              git ls-files | grep -E "$pattern" | sed 's/^/    /'
              fail=1
            fi
          }

          check_absent '(^|/)build/'                "build output"
          check_absent '(^|/)dist/'                 "distribution output"
          check_absent '(^|/)\.idea/'               "JetBrains IDE config"
          check_absent '\.artifact\.md$'            "AI scratch artefacts"
          check_absent '(^|/)\.artifacts/'          "AI scratch directories"
          check_absent 'google-services\.json$'     "Firebase config (contains API keys)"
          check_absent 'GoogleService-Info\.plist$' "Firebase config (contains API keys)"
          check_absent '\.(jks|keystore|p12|pem)$'  "signing keys"
          check_absent '(^|/)key\.properties$'      "signing credentials"
          check_absent '(^|/)\.env$'                "environment secrets"
          check_absent '\.(pyz|pkg|toc)$'           "PyInstaller intermediates"

          # Guard against reintroducing the hardcoded loopback token.
          if git grep -nI --exclude-dir=.git 'cypher-internal-pc-app-token' -- . ; then
            echo "::error::Hardcoded internal token literal reintroduced."
            echo "        The node generates a per-install token; see backend/core/server.py::_get_internal_token."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo
            echo "See .gitignore for the rules that should have caught this."
            exit 1
          fi
          echo "Hygiene checks passed."

      - name: Verify required community files exist
        run: |
          set -euo pipefail
          missing=0
          for f in LICENSE NOTICE README.md CHANGELOG.md AGENTS.md ROADMAP.md \
                   CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md \
                   docs/plans/rebuild-desktop-ui.md \
                   docs/plans/rebuild-mobile-ui.md \
                   docs/plans/security-hardening.md ; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ───────────────────────────────────────────────────────────
  # Python node
  # ───────────────────────────────────────────────────────────
  node:
    name: Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: hygiene
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: pc_app_flutter/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pc_app_flutter/backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      # Gradual typing (P1-B6). `files` in backend/pyproject.toml lists only the
      # modules that currently type-check cleanly, so this is a ratchet: adding a
      # module is a one-way door. It catches the bug class that produced F-02/F-03
      # (a name referenced in 22 routes but never imported) at the same time as
      # ruff's F821, but with type information.
      - name: Mypy (typed modules only)
        run: mypy

      - name: Ruff format check
        run: |
          ruff format --diff --check . || {
            echo "::warning::Formatting drift. Run 'ruff format pc_app_flutter/backend' locally."
            exit 0
          }

      # Catches the class of bug that took the whole node down before:
      # an f-string with a backslash is a SyntaxError below Python 3.12.
      - name: Compile-check every module on this interpreter
        run: python -m compileall -q core service.py

      - name: Pytest
        run: |
          set -o pipefail
          pytest tests -q --cov=core --cov-report=term-missing 2>&1 | tee pytest.log || {
            echo "::error::Node tests failed."
            if grep -q "Required test coverage" pytest.log; then
              measured=$(grep -oE "Total coverage: [0-9.]+%" pytest.log | tail -1 || true)
              echo "::error::Coverage ratchet not met ($measured). Either add tests, or raise fail_under in pc_app_flutter/backend/pyproject.toml to the measured value. It must never be lowered."
            fi
            exit 1
          }

  # ───────────────────────────────────────────────────────────
  # Flutter clients
  # ───────────────────────────────────────────────────────────
  flutter:
    name: ${{ matrix.app }} analyze & test
    runs-on: ubuntu-latest
    needs: hygiene
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mobile_app
          - app: pc_app_flutter

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify pubspec.lock is committed and current
        run: |
          if ! git diff --exit-code -- pubspec.lock; then
            echo "::error::pubspec.lock is out of date. Run 'flutter pub get' and commit it."
            exit 1
          fi

      - name: Check for banned dependencies
        run: |
          set -euo pipefail
          # The project's contract is "local-first, no telemetry". These
          # packages would break that promise. See NOTICE and
          # docs/plans/security-hardening.md · Phase S5.
          banned='firebase|google-services|analytics|sentry|mixpanel|amplitude|segment|posthog|onesignal|facebook'
          if grep -qiE "$banned" pubspec.yaml; then
            echo "::error::pubspec.yaml declares a telemetry/cloud dependency:"
            grep -inE "$banned" pubspec.yaml
            exit 1
          fi
          echo "No banned dependencies."

      # BLOCKING: real defects. Errors and warnings mean broken code.
      - name: Analyze (errors and warnings)
        run: flutter analyze --no-pub --no-fatal-infos --fatal-warnings

      # NON-BLOCKING (for now): style.
      #
      # Neither of these can pass on the current tree, and turning them on red
      # would make CI noise that contributors learn to ignore — the same argument
      # as the coverage ratchet in backend/pyproject.toml.
      #
      # `dart format` has never been run over this codebase (27 mobile screens,
      # 7 desktop tabs), and `--fatal-infos` fails on the ~130 hardcoded colour
      # literals and other lint that A-07/A-08 already track as P2-M2/P2-D1.
      #
      # P1-T5 is the task that fixes this properly: run the formatter once in a
      # dedicated commit, clear the lint backlog, then flip both steps to
      # blocking in the same PR. Until then they report and annotate.
      - name: Style report (non-blocking until P1-T5)
        run: |
          set +e
          echo "::group::dart format --output=none --set-exit-if-changed lib test"
          dart format --output=none --set-exit-if-changed lib test
          fmt=$?
          echo "::endgroup::"

          echo "::group::flutter analyze --fatal-infos"
          flutter analyze --no-pub --fatal-infos
          info=$?
          echo "::endgroup::"

          if [ "$fmt" -ne 0 ]; then
            echo "::warning title=Formatting drift::Run 'dart format lib test' in ${GITHUB_WORKSPACE}/${{ matrix.app }}. Becomes blocking at P1-T5."
          fi
          if [ "$info" -ne 0 ]; then
            echo "::warning title=Lint infos::flutter analyze --fatal-infos reported issues. Tracked as A-07/A-08 (P2-M2, P2-D1); becomes blocking at P1-T5."
          fi
          exit 0

      - name: Test
        run: flutter test --no-pub --reporter expanded

  # ───────────────────────────────────────────────────────────
  # Android assemble — proves a release APK can actually be built
  # without publishing anything. Unsigned; signing is release.yml's job.
  # ───────────────────────────────────────────────────────────
  android-build:
    name: Android release assemble
    runs-on: ubuntu-latest
    needs: [hygiene, flutter]
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No key.properties here on purpose: build.gradle.kts must fall back to the
      # debug keystore with a warning rather than failing. That fallback is what
      # keeps `flutter run --release` working for contributors.
      - name: Assemble release APK (debug-signed smoke build)
        run: flutter build apk --release

      - name: Report unsigned-build fallback
        run: |
          echo "::notice::Built with the debug keystore. Release signing is exercised in release.yml."

      - name: Upload smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-apk
          path: mobile_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 3

  # ───────────────────────────────────────────────────────────
  # Docs link check — docs are a deliverable, so they get a gate.
  # ───────────────────────────────────────────────────────────
  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Check relative Markdown links resolve
        run: |
          set -euo pipefail
          fail=0
          # Collect every markdown file except vendored/generated output.
          mapfile -t files < <(git ls-files '*.md' ':!:**/build/**')
          for f in "${files[@]}"; do
            dir=$(dirname "$f")
            # Extract relative links: [text](path) where path has no scheme.
            grep -oE '\]\(([^)]+)\)' "$f" 2>/dev/null \
              | sed -E 's/^\]\(//; s/\)$//' \
              | grep -vE '^(https?:|mailto:|#|/)' \
              | sed -E 's/#.*$//' \
              | grep -v '^$' \
              | while read -r link; do
                  target="$dir/$link"
                  if [ ! -e "$target" ]; then
                    echo "::error::$f -> broken link: $link"
                    exit 1
                  fi
                done || fail=1
          done
          exit $fail

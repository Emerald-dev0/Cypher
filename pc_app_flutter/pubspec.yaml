name: cypher_pc
description: CYPHER - Desktop Control Tower
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.5
  google_fonts: ^8.1.0
  animate_do: ^4.1.1
  window_manager: ^0.4.3
  intl: ^0.20.0
  path: ^1.9.1
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
